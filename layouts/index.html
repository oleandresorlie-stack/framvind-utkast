<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Framvind — forhåndsvisningsmaler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --brand:#1a1a1a; --brand-ink:#950b0b; --brand-bg:#ffffff; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:Inter,system-ui,-apple-system,sans-serif; background:#f7f5f3; color:var(--brand); line-height:1.5; min-height:100dvh; padding:1.5rem 1rem 3rem; }
    .wrap { max-width:420px; margin:0 auto; }
    h1 { font-family:"Cormorant Garamond",Georgia,serif; font-size:1.75rem; font-weight:700; margin-bottom:0.35rem; }
    .lead { color:#5c5752; font-size:0.95rem; margin-bottom:1.5rem; }
    .card { display:block; background:var(--brand-bg); border-radius:12px; padding:1.15rem 1.25rem; margin-bottom:0.85rem; text-decoration:none; color:inherit; border:1px solid #e8e4e0; box-shadow:0 1px 2px rgba(26,26,26,0.04); }
    .card strong { display:block; font-size:1.1rem; margin-bottom:0.25rem; }
    .card span { color:#5c5752; font-size:0.9rem; }
    .tag { display:inline-block; font-size:0.7rem; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; color:var(--brand-ink); margin-bottom:0.35rem; }
    footer { margin-top:2rem; font-size:0.8rem; color:#8a8580; text-align:center; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Forhåndsvisningsmaler</h1>
    <p class="lead">Velg en layout — demo med Skøyen Renseri AS.</p>
    <a class="card" href="direkt/"><div class="tag">01</div><strong>Direkt</strong><span>Hero + én knapp, tjenester, anmeldelser.</span></a>
    <a class="card" href="tillit/"><div class="tag">02</div><strong>Tillit</strong><span>Google-stjerner og kundecitater først.</span></a>
    <a class="card" href="kompakt/"><div class="tag">03</div><strong>Kompakt</strong><span>Telefon først, sticky Ring-bar.</span></a>
    <footer>Utkast fra Framvind — ikke offisiell side</footer>
  </div>
</body>
</html>
